#@TYPE: Machine
#@NAME: Nvidia Jetson Orin Nano 8GB (P3767-0005)
#@DESCRIPTION: Nvidia Jetson Orin dev kit (P3767-0005 module in P3768-0000 carrier)

TNSPEC_BOOTDEV ?= "nvme0n1p1"
PARTITION_LAYOUT_TEMPLATE_DEFAULT ?= "flash_t234_qspi.xml"
PARTITION_LAYOUT_TEMPLATE_DEFAULT_SUPPORTS_REDUNDANT ?= "1"
PARTITION_LAYOUT_EXTERNAL_DEFAULT ?= "flash_l4t_t234_nvme.xml"

TEGRAFLASH_SDCARD_SIZE ?= "63G"
ROOTFSPART_SIZE_DEFAULT ?= "59055800320"
ROOTFSPART_SIZE ?= "${ROOTFSPART_SIZE_DEFAULT}"

KERNEL_DEVICETREE ?= "tegra234-p3768-0000+p3767-0005-nv-super.dtb"

require ${@bb.utils.contains('BUILD_NVIDIA_PROPRIETARY_PACKAGE', '1', \
			     'conf/machine/include/orin-nano.inc', '', d)}

require nvidia-orin-common.inc

MACHINEOVERRIDES:append = ":jetson-orin-nano-devkit"

BSP_NVIDIA_DERIVED:append=" nvidia-orin-nano"

TEGRA_PLUGIN_MANAGER_OVERLAYS:append = " ${@bb.utils.contains('BUILD_NVIDIA_PROPRIETARY_PACKAGE', '1', \
	'tegra234-p3767-camera-p3768-imx219-dual.dtbo', '', d)}"

BOOTABLE_OVERLAY ?= "tegra234-p3768-0000+p3767-0005-nv-super-boot-overlay.dtbo"
