BUILD_NVIDIA_PROPRIETARY_PACKAGE ?= "0"
DISTRO_FEATURES:append = " ${@bb.utils.contains('BUILD_NVIDIA_PROPRIETARY_PACKAGE', '1', \
	'largefile opengl ptest multiarch wayland vulkan \
	systemd pam virtualization usrmerge', '', d)}"
IMAGE_FEATURES:append = " ${@bb.utils.contains('BUILD_NVIDIA_PROPRIETARY_PACKAGE', '1', \
	'hwcodecs', '', d)}"
PREFERRED_VERSION_optee-client ?= "${@bb.utils.contains('BUILD_NVIDIA_PROPRIETARY_PACKAGE', '1', \
        '%-l4t-%', '', d)}"
PREFERRED_VERSION_optee-os ?= "${@bb.utils.contains('BUILD_NVIDIA_PROPRIETARY_PACKAGE', '1', \
        '%-l4t-%', '', d)}"
PREFERRED_VERSION_optee-os-tadevkit ?= "${@bb.utils.contains('BUILD_NVIDIA_PROPRIETARY_PACKAGE', '1', \
        '%-l4t-%', '', d)}"

IMAGE_INSTALL:append = " ${@bb.utils.contains('BUILD_NVIDIA_PROPRIETARY_PACKAGE', '1', \
	'tegra-tools-tegrastats \
	cuda-samples \
	argus-samples \
	gstreamer-tests \
	l4t-graphics-demos-x11 \
	nvgstapps \
	tegra-mmapi-tests \
	vpi3-tests \
	tensorrt-tests \
	cudnn-samples \
	deepstream-tests \
	python3-jetson-stats \
	docker \
	nvidia-docker \
	nvidia-docker-tests \
	optee-nvsamples \
	optee-test \
	v4l-utils \
	dtc \
	can-utils \
	devmem2 \
	alsa-utils \
	gstreamer1.0-plugins-ugly', '', d)}"

IMAGE_INSTALL:append = " ${@bb.utils.contains('DISTRO_FEATURES', 'opengl x11', 'mesa-demos', '', d)}"
IMAGE_INSTALL:append = " ${@bb.utils.contains('DISTRO_FEATURES', 'vulkan', 'vulkan-tools', '', d)}"

TOOLCHAIN_HOST_TASK:append = " ${@bb.utils.contains('BUILD_NVIDIA_PROPRIETARY_PACKAGE', '1', \
	'nativesdk-packagegroup-cuda-sdk-host', '', d)}"

IMAGE_INSTALL:append = " nvidia-kernel-oot \
                         nvidia-kernel-oot-dtb \
"
