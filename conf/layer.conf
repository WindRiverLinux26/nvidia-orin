# We have a conf and classes directory, add to BBPATH
BBPATH =. "${LAYERDIR}:"

# We have a packages directory, add to BBFILES
BBFILES += "${@bb.utils.contains_any('MACHINE', 'nvidia-orin-agx nvidia-orin-nx nvidia-orin-nano', \
				     '${LAYERDIR}/recipes-*/*/*.bb \
				      ${LAYERDIR}/recipes-*/*/*.bbappend \
				      ${LAYERDIR}/classes/*.bbclass', '', d)}"

BBFILE_COLLECTIONS += "wr-nvidia-orin"
BBFILE_PATTERN_wr-nvidia-orin := "^${LAYERDIR}/"
BBFILE_PRIORITY_wr-nvidia-orin = "7"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_wr-nvidia-orin = "1"

LAYERSERIES_COMPAT_wr-nvidia-orin = "wrl wrynose"
LAYERDEPENDS_wr-nvidia-orin = "core wrlinux tegra tegra-community"

# Use linux-yocto kernel for nvidia-orin machines
# This ensures linux-yocto is used regardless of layer load order
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto = "6.18%"
PREFERRED_VERSION_linux-yocto-rt = "6.18%"
